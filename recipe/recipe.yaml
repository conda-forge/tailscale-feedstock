context:
  version: "1.98.2"

recipe:
  name: tailscale
  version: ${{ version }}

source:
  - url: https://github.com/tailscale/tailscale/archive/refs/tags/v${{ version }}.tar.gz
    sha256: a8170bdb73e318f6b91f5caab9b0f9bb218e1abcf6d6f7a393d8a44bf8547cff
  - url: https://raw.githubusercontent.com/golang/freetype/e2365dfdc4a05e4b8299a783240d4a7d5a65d4e4/LICENSE
    sha256: d3ba056adc2b7909e95681deaae397fb37c97ed491a920f491214f07b62c41d0
    file_name: LICENSE-golang-freetype
  - url: https://raw.githubusercontent.com/jmespath/go-jmespath/b0104c826a24d7c202da8e1dbfb9ea4cfa35d774/LICENSE
    sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
    file_name: LICENSE-go-jmespath

build:
  number: 0

outputs:
  - package:
      name: tailscale
    build:
      script:
        interpreter: nu
        content:
          - let version_short = "${{ version }}"
          - let version_git_hash = git ls-remote https://github.com/tailscale/tailscale.git refs/tags/v($version_short)^{} | split row -r '\s+' | get 0
          - let version_long = $version_short + "-t" + ($version_git_hash | str substring 0..8)
          - let ldflags = $"-s -w -X tailscale.com/version.longStamp=($version_long) -X tailscale.com/version.shortStamp=($version_short) -X tailscale.com/version.gitCommitStamp=($version_git_hash)"
          - if: unix
            then: let target_directory = ($env.PREFIX)/bin/
            else: let target_directory = ($env.LIBRARY_BIN)/
          - go build -v -buildvcs=false -ldflags $ldflags -o $target_directory ./cmd/tailscale
          - go-licenses save ./cmd/tailscale --save_path ./thirdparty --ignore github.com/golang/freetype --ignore github.com/jmespath/go-jmespath
          - mkdir ./thirdparty/github.com/golang/freetype ./thirdparty/github.com/jmespath/go-jmespath
          - cp LICENSE-golang-freetype ./thirdparty/github.com/golang/freetype/LICENSE
          - cp LICENSE-go-jmespath ./thirdparty/github.com/jmespath/go-jmespath/LICENSE
          - if: unix
            then:
              - mkdir ($env.PREFIX)/share/bash-completion/completions ($env.PREFIX)/share/zsh/site-functions ($env.PREFIX)/share/fish/vendor_completions.d
              - ^$"($env.PREFIX)/bin/tailscale" completion bash | save ($env.PREFIX)/share/bash-completion/completions/tailscale
              - ^$"($env.PREFIX)/bin/tailscale" completion zsh | save ($env.PREFIX)/share/zsh/site-functions/_tailscale
              - ^$"($env.PREFIX)/bin/tailscale" completion fish | save ($env.PREFIX)/share/fish/vendor_completions.d/tailscale.fish
    requirements:
      build:
        - nushell
        - ${{ compiler('go-nocgo') }} >=1.22
        - go-licenses
      host:
        - git
    tests:
      - script:
          - tailscale version
      - package_contents:
          bin:
            - tailscale
          files:
            - if: unix
              then:
                - share/bash-completion/completions/tailscale
                - share/zsh/site-functions/_tailscale
                - share/fish/vendor_completions.d/tailscale.fish
          strict: true

  - package:
      name: tailscaled
    build:
      script:
        interpreter: nu
        content:
          - let version_short = "${{ version }}"
          - let version_git_hash = git ls-remote https://github.com/tailscale/tailscale.git refs/tags/v($version_short)^{} | split row -r '\s+' | get 0
          - let version_long = $version_short + "-t" + ($version_git_hash | str substring 0..8)
          - let ldflags = $"-s -w -X tailscale.com/version.longStamp=($version_long) -X tailscale.com/version.shortStamp=($version_short) -X tailscale.com/version.gitCommitStamp=($version_git_hash)"
          - if: unix
            then: let target_directory = ($env.PREFIX)/bin/
            else: let target_directory = ($env.LIBRARY_BIN)/
          - go build -v -buildvcs=false -ldflags $ldflags -o $target_directory ./cmd/tailscaled
          - go-licenses save ./cmd/tailscaled --save_path ./thirdparty --ignore github.com/jmespath/go-jmespath
          - mkdir ./thirdparty/github.com/jmespath/go-jmespath
          - cp LICENSE-go-jmespath ./thirdparty/github.com/jmespath/go-jmespath/LICENSE
    requirements:
      build:
        - nushell
        - ${{ compiler('go-nocgo') }} >=1.22
        - go-licenses
      host:
        - git
    tests:
      - script:
          - tailscaled -version
      - package_contents:
          bin:
            - tailscaled
          strict: true

about:
  homepage: https://tailscale.com
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - thirdparty
  summary: The easiest, most secure way to use WireGuard and 2FA.
  documentation: https://tailscale.com/docs
  repository: https://github.com/tailscale/tailscale

extra:
  recipe-maintainers:
    - borchero
    - yuikisaito
